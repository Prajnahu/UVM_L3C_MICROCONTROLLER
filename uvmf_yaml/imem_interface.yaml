uvmf:
  interfaces:
    "imem":
      clock: "clock"
      reset: "reset"
      reset_assertion_level: "True"
      veloce_ready: "True"
      hvl_pkg_parameters:
        - name: "OP_BR"
          type: "bit [3:0]"
          value: "4'd0"
        - name: "OP_ADD"
          type: "bit [3:0]"
          value: "4'd1"
        - name: "OP_LD"
          type: "bit [3:0]"
          value: "4'd2"
        - name: "OP_ST"
          type: "bit [3:0]"
          value: "4'd3"
        - name: "OP_AND"
          type: "bit [3:0]"
          value: "4'd5"
        - name: "OP_LDR"
          type: "bit [3:0]"
          value: "4'd6"
        - name: "OP_STR"
          type: "bit [3:0]"
          value: "4'd7"
        - name: "OP_NOT"
          type: "bit [3:0]"
          value: "4'd9"
        - name: "OP_LDI"
          type: "bit [3:0]"
          value: "4'd10"
        - name: "OP_STI"
          type: "bit [3:0]"
          value: "4'd11"
        - name: "OP_JMP"
          type: "bit [3:0]"
          value: "4'd12"
        - name: "OP_LEA"
          type: "bit [3:0]"
          value: "4'd14"
        - name: "OP_JSR"
          type: "bit [3:0]"
          value: "4'd4"
        - name: "OP_RTI"
          type: "bit [3:0]"
          value: "4'd8"
        - name: "OP_RSVD"
          type: "bit [3:0]"
          value: "4'd13"
        - name: "OP_TRAP"
          type: "bit [3:0]"
          value: "4'd15"
      ports:
        - name: "pc"
          width: "16"
          dir: "output"
        - name: "instrmem_rd"
          width: "1"
          dir: "output"
        - name: "Instr_dout"
          width: "16"
          dir: "input"
        - name: "complete_instr"
          width: "1"
          dir: "input"
      transaction_vars:
        - name: "opcode"
          type: "bit [3:0]"
          isrand: "True"
          iscompare: "True"
        - name: "operands"
          type: "bit [11:0]"
          isrand: "True"
          iscompare: "True"
        - name: "pc"
          type: "bit [15:0]"
          isrand: "False"
          iscompare: "False"
      transaction_constraints:
        - name: "supported_opcode_c"
          value: "{ opcode inside { OP_BR, OP_ADD, OP_LD, OP_ST, OP_AND, OP_LDR, OP_STR, OP_NOT, OP_LDI, OP_STI, OP_JMP, OP_LEA }; }"
        - name: "legal_encoding_c"
          value: "{ ( opcode == OP_NOT ) -> ( operands[5:0] == 6'b111111 ); ( opcode == OP_JMP ) -> ( operands[11:9] == 3'b000 && operands[5:0] == 6'b000000 ); ( ( opcode == OP_ADD || opcode == OP_AND ) && operands[5] == 1'b0 ) -> ( operands[4:3] == 2'b00 ); }"
        - name: "no_br_never_c"
          value: "{ ( opcode == OP_BR ) -> ( operands[11:9] != 3'b000 ); }"
