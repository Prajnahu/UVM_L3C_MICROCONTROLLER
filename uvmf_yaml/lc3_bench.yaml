uvmf:
  benches:
    "lc3":
      top_env: "lc3"
      clock_half_period: "5ns"
      clock_phase_offset: "0ns"
      reset_assertion_level: "True"
      reset_duration: "47ns"
      active_passive_default: "PASSIVE"
      active_passive:
        - bfm_name: "imem_agent"
          value: "ACTIVE"
        - bfm_name: "dmem_agent"
          value: "ACTIVE"
