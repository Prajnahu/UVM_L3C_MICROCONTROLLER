uvmf:
  interfaces:
    "fetch_in":
      clock: "clock"
      reset: "reset"
      reset_assertion_level: "True"
      veloce_ready: "True"
      ports:
        - name: "enable_updatePC"
          width: "1"
          dir: "input"
        - name: "enable_fetch"
          width: "1"
          dir: "input"
        - name: "br_taken"
          width: "1"
          dir: "input"
        - name: "taddr"
          width: "16"
          dir: "input"
      transaction_vars:
        - name: "enable_updatePC"
          type: "bit"
          isrand: "False"
          iscompare: "True"
        - name: "enable_fetch"
          type: "bit"
          isrand: "False"
          iscompare: "True"
        - name: "br_taken"
          type: "bit"
          isrand: "False"
          iscompare: "True"
        - name: "taddr"
          type: "bit [15:0]"
          isrand: "False"
          iscompare: "True"
