uvmf:
  environments:
    "control":
      agents:
        - name: "control_in_agent"
          type: "control_in"
          initiator_responder: "INITIATOR"
        - name: "control_out_agent"
          type: "control_out"
          initiator_responder: "INITIATOR"
      analysis_components:
        - name: "control_pred"
          type: "control_predictor"
      scoreboards:
        - name: "control_sb"
          sb_type: "lc3_in_order_scoreboard"
          trans_type: "control_out_transaction"
      imports:
        - name: "lc3_prediction_pkg"
        - name: "lc3_common_pkg"
      tlm_connections:
        - driver: "control_in_agent.monitored_ap"
          receiver: "control_pred.control_in_agent_ae"
        - driver: "control_pred.control_sb_ap"
          receiver: "control_sb.expected_analysis_export"
        - driver: "control_out_agent.monitored_ap"
          receiver: "control_sb.actual_analysis_export"
